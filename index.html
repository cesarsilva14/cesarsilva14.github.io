<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1016" />
    <title>Now Playing Widget Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="studio-shell">
      <header class="hero">
        <p class="eyebrow">README widget studio</p>
        <h1>Now Playing <span>Widget</span> Studio</h1>
        <p class="subtitle">Customize the card before you paste it into GitHub. Spotify is optional — the widget works even without a live connection.</p>
      </header>

      <div class="studio-grid">
        <section class="panel preview-panel">
          <div class="preview-topbar">
            <span class="status-badge">Now Playing</span>
            <button id="spotify-connect" class="ghost-button" type="button">Connect Spotify</button>
          </div>

          <div id="widget-preview" class="widget-preview">
            <div class="cover-art" aria-hidden="true"></div>
            <div class="widget-copy">
              <p class="listening-label">Listening to</p>
              <h2 id="preview-title">Midnight City</h2>
              <p id="preview-artist" class="artist-name">M83</p>
              <p id="preview-album" class="album-name">Hurry Up, We’re Dreaming</p>
            </div>
          </div>

          <div class="action-row">
            <button id="copy-link" class="primary-button" type="button">Copy preview URL</button>
            <button id="copy-markdown" class="secondary-button" type="button">Copy markdown</button>
          </div>

          <p id="status-message" class="status-message" aria-live="polite"></p>
        </section>

        <aside class="panel controls-panel">
          <h2>Customize</h2>

          <label class="field">
            <span>Song title</span>
            <input id="title-input" type="text" value="Midnight City" />
          </label>

          <label class="field">
            <span>Artist</span>
            <input id="artist-input" type="text" value="M83" />
          </label>

          <label class="field">
            <span>Album</span>
            <input id="album-input" type="text" value="Hurry Up, We’re Dreaming" />
          </label>

          <label class="field">
            <span>Album art URL</span>
            <input id="art-input" type="url" value="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80" />
          </label>

          <div class="color-grid">
            <label class="field color-field">
              <span>Gradient start</span>
              <input id="bg1-input" type="color" value="#0d1b19" />
            </label>
            <label class="field color-field">
              <span>Gradient end</span>
              <input id="bg2-input" type="color" value="#0a2d30" />
            </label>
            <label class="field color-field">
              <span>Accent</span>
              <input id="accent-input" type="color" value="#93f5c7" />
            </label>
            <label class="field color-field">
              <span>Text</span>
              <input id="text-input" type="color" value="#f2f7f5" />
            </label>
          </div>

          <label class="field">
            <span>Overlay opacity</span>
            <input id="overlay-input" type="range" min="0" max="100" value="56" />
          </label>

          <label class="field">
            <span>Corner radius</span>
            <input id="radius-input" type="range" min="8" max="40" value="26" />
          </label>

          <div class="toggle-row">
            <label><input id="show-art" type="checkbox" checked /> Show art</label>
            <label><input id="show-album" type="checkbox" checked /> Show album</label>
            <label><input id="show-artist" type="checkbox" checked /> Show artist</label>
          </div>
        </aside>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
