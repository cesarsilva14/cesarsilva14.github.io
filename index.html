<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Spotify GitHub Profile Widget Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">Spotify GitHub Profile Widget</header>
  <main class="page">
    <header class="page-heading">
      <div><p class="eyebrow">Novatorem theme only</p><h1>Spotify GitHub Profile</h1><p class="intro">Configure a Novatorem Spotify profile widget and copy the embed for your README.</p></div>
      <span id="widget-status" class="widget-status" role="status">Enter your Spotify UID to preview</span>
    </header>

    <section class="settings" aria-label="Novatorem widget settings">
      <div class="identity-fields">
        <label class="field">Spotify UID<input id="spotify-uid" type="text" autocomplete="off" spellcheck="false" placeholder="Enter your Spotify UID" value="" /></label>
        <label class="field">Profile link<input id="profile-link" type="url" placeholder="https://example.com/your-profile" value="" /></label>
      </div>
      <div class="options-grid">
        <label><input id="cover-image" type="checkbox" checked /> Cover Image</label>
        <label><input id="open-spotify" type="checkbox" /> Open in Spotify</label>
        <label><input id="show-offline" type="checkbox" /> Show Offline</label>
        <label><input id="interchange" type="checkbox" /> Interchange Artist with Song name</label>
        <label><input id="profanity" type="checkbox" /> Censor Profanity</label>
        <label><input id="hide-remaster" type="checkbox" /> Hide Remaster</label>
      </div>
      <div class="color-settings">
        <label class="color-setting">Bar Color<input id="bar-color" type="color" value="#ffffff" /></label>
        <label class="color-setting">Background Color<input id="background-color" type="color" value="#07a196" /></label>
        <label class="checkbox-setting"><input id="bar-color-cover" type="checkbox" /> Automatic bar color from cover</label>
      </div>
    </section>

    <section class="code-section" aria-label="Generated embed code">
      <div class="code-tabs" role="tablist" aria-label="Code format">
        <button id="markdown-tab" class="code-tab active" role="tab" aria-selected="true" type="button">Markdown Code</button>
        <button id="html-tab" class="code-tab" role="tab" aria-selected="false" type="button">HTML Code</button>
      </div>
      <textarea id="code-output" readonly aria-label="Generated Novatorem embed code" placeholder="Enter your Spotify UID to generate embed code"></textarea>
      <button id="copy-code" class="copy-button" type="button">▢ &nbsp; COPY TO CLIPBOARD</button>
      <p id="copy-status" class="copy-status" aria-live="polite"></p>
    </section>

    <section class="preview-section" aria-labelledby="preview-heading">
      <h2 id="preview-heading">Preview</h2>
      <div class="widget-frame"><img id="widget-preview" alt="Enter a Spotify UID to preview the Novatorem widget" /></div>
      <p class="preview-note">Your UID and profile link are entered by you and saved only in this browser.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
