<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Widget Preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,Arial,sans-serif;background:transparent;color:#444}body{padding:5px}.widget{display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px;padding:4px;background:transparent}.cover-wrap{position:relative;width:80px;height:80px;flex:0 0 auto;overflow:hidden;border:2px solid var(--bar,#53b14f);border-radius:3px}.cover-wrap img{display:block;width:100%;height:100%;object-fit:cover}.map-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.details{width:min(330px,calc(100vw - 110px));min-width:0;text-align:center}.artist,.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:0 0 3px;color:#444;font-size:17px;font-weight:600}.song{margin:0;color:#999;font-size:15px}.wave{display:block;width:100%;height:15px;margin-top:4px}.wave path{fill:none;stroke:var(--bar,#53b14f);stroke-width:2.4;stroke-linecap:round}
</style></head>
<body><div class="widget" id="widget"><div class="cover-wrap" id="cover-wrap"><img id="cover" alt="Album cover"><canvas id="map" class="map-canvas"></canvas></div><div class="details"><p id="artist" class="artist"></p><p id="song" class="song">No track data</p><svg id="wave" class="wave" viewBox="0 0 360 24" preserveAspectRatio="none"><path d="M0 12 C12 12 12 3 24 3 S36 21 48 21 60 7 72 7 84 17 96 17 108 3 120 3 132 21 144 21 156 8 168 8 180 16 192 16 204 4 216 4 228 20 240 20 252 7 264 7 276 17 288 17 300 3 312 3 324 21 336 21 348 12 360 12"/></svg></div></div>
<script>
const q=new URLSearchParams(location.search),v=(k,d)=>q.get(k)??d;let artist=v('artist',''),title=v('title','');if(v('interchange','false')==='true')[artist,title]=[title,artist];const clean=x=>v('censor','false')==='true'?x.replace(/\b(fuck|fucking|shit|bitch|damn|asshole)\b/ig,'••••'):x;if(v('hideRemaster','false')==='true')title=title.replace(/\s*[-–(]?\s*\d{4}\s+Remaster[^)]*\)?/ig,'').replace(/\s*\(Remaster(ed)?[^)]*\)/ig,'').trim();document.getElementById('artist').textContent=clean(artist);document.getElementById('song').textContent=clean(title)||'No track data';const cover=document.getElementById('cover');cover.src=v('art','');document.getElementById('widget').style.setProperty('--bar',v('bar','#53b14f'));document.body.style.background=v('bg','transparent');if(v('cover','true')==='false')document.getElementById('cover-wrap').style.display='none';if(v('wave','true')==='false')document.getElementById('wave').style.display='none';const canvas=document.getElementById('map');if(v('gradient','true')==='true'&&v('art','')){cover.crossOrigin='anonymous';cover.onload=()=>{try{const n=180,work=document.createElement('canvas');work.width=n;work.height=n;const ctx=work.getContext('2d',{willReadFrequently:true});ctx.drawImage(cover,0,0,n,n);const frame=ctx.getImageData(0,0,n,n),d=frame.data,hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],lo=hex(v('shadow','#172b46')),mid=hex(v('mid','#8167a8')),hi=hex(v('highlight','#ffd6a0')),strength=Number(v('strength','100'))/100;for(let i=0;i<d.length;i+=4){const l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255,a=l<.5?lo:mid,b=l<.5?mid:hi,t=l<.5?l*2:(l-.5)*2;for(let k=0;k<3;k++)d[i+k]+=(a[k]+(b[k]-a[k])*t-d[i+k])*strength}canvas.width=n;canvas.height=n;canvas.getContext('2d').putImageData(frame,0,0)}catch{canvas.style.display='none'}};cover.onerror=()=>canvas.style.display='none'};
</script></body></html>
