<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novatorem Spotify Widget Preview</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,Arial,sans-serif;background:transparent;color:#444}body{padding:4px}.widget{--bar:#53b14f;--shadow:#172b46;--mid:#8167a8;--highlight:#ffd6a0;--strength:.55;display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px;padding:3px;background:transparent}.cover-link{position:relative;width:80px;height:80px;flex:0 0 auto;overflow:hidden;border:3px solid var(--bar);border-radius:4px}.cover-link img{display:block;width:100%;height:100%;object-fit:cover}.map{position:absolute;inset:0;background:linear-gradient(135deg,var(--shadow),var(--mid) 50%,var(--highlight));opacity:var(--strength);mix-blend-mode:color}.details{width:min(330px,calc(100vw - 110px));min-width:0;text-align:center}.artist,.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:0 0 3px;color:#444;font-size:17px;font-weight:600}.song{margin:0;color:#999;font-size:15px}.wave{display:block;width:100%;height:15px;margin-top:4px}.wave path{fill:none;stroke:var(--bar);stroke-width:2.4;stroke-linecap:round}
</style></head>
<body><div class="widget" id="widget"><a id="cover-link" class="cover-link" href="#" target="_blank" rel="noreferrer"><img id="cover" alt="Album cover"><span id="map" class="map"></span></a><div class="details"><p id="artist" class="artist"></p><p id="song" class="song"></p><svg id="wave" class="wave" viewBox="0 0 360 24" preserveAspectRatio="none"><path d="M0 12 C12 12 12 3 24 3 S36 21 48 21 60 7 72 7 84 17 96 17 108 3 120 3 132 21 144 21 156 8 168 8 180 16 192 16 204 4 216 4 228 20 240 20 252 7 264 7 276 17 288 17 300 3 312 3 324 21 336 21 348 12 360 12"/></svg></div></div>
<script>
const q=new URLSearchParams(location.search),v=(k,d)=>q.get(k)??d,w=document.getElementById('widget');w.style.setProperty('--bar',v('bar','#53b14f'));w.style.setProperty('--shadow',v('shadow','#172b46'));w.style.setProperty('--mid',v('mid','#8167a8'));w.style.setProperty('--highlight',v('highlight','#ffd6a0'));w.style.setProperty('--strength',String(Number(v('strength','55'))/100));document.body.style.background=v('background','transparent');let artist=v('artist','M83'),title=v('title','Midnight City');if(v('interchange','false')==='true')[artist,title]=[title,artist];document.getElementById('artist').textContent=artist;document.getElementById('song').textContent=title;document.getElementById('cover').src=v('art','https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=600&q=80');const href=v('track_url','#');document.getElementById('cover-link').href=v('open_spotify','false')==='true'?href:'#';if(v('cover','true')==='false')document.getElementById('cover-link').style.display='none';if(v('wave','true')==='false')document.getElementById('wave').style.display='none';if(v('gradient','true')==='false')document.getElementById('map').style.display='none';
</script></body></html>
