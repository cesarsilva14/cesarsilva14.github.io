<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Now Playing Widget</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,Arial,sans-serif;background:transparent;color:var(--text,#30343b)}body{padding:4px}.widget{display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px;padding:3px;background:transparent}.cover-wrap{position:relative;width:80px;height:80px;flex:0 0 auto;overflow:hidden;border:2px solid rgba(120,120,120,.35)}.cover-wrap img{display:block;width:100%;height:100%;object-fit:cover}.cover-map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.details{width:min(330px,calc(100vw - 110px));min-width:0;text-align:center}.artist,.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:0 0 3px;color:var(--text,#30343b);font-size:17px;font-weight:600}.song{margin:0;color:var(--text,#30343b);opacity:.7;font-size:15px}.wave{display:block;width:100%;height:15px;margin-top:4px}.wave path{fill:none;stroke:var(--wave,#fff);stroke-width:2.4;stroke-linecap:round}
</style></head>
<body><div class="widget" id="widget"><div class="cover-wrap" id="cover-wrap"><img id="cover" alt="Album cover"><canvas id="cover-map" class="cover-map"></canvas></div><div class="details"><p id="artist" class="artist"></p><p id="song" class="song">No track data</p><svg class="wave" id="wave" viewBox="0 0 360 24" preserveAspectRatio="none"><path d="M0 12 C12 12 12 3 24 3 S36 21 48 21 60 7 72 7 84 17 96 17 108 3 120 3 132 21 144 21 156 8 168 8 180 16 192 16 204 4 216 4 228 20 240 20 252 7 264 7 276 17 288 17 300 3 312 3 324 21 336 21 348 12 360 12"/></svg></div></div><script>
const q=new URLSearchParams(location.search),v=(k,d)=>q.get(k)??d;let a=v('artist',''),t=v('title','');if(v('interchange','false')==='true')[a,t]=[t,a];const censor=s=>v('censor','false')==='true'?s.replace(/\b(fuck|fucking|shit|bitch|damn|asshole)\b/ig,'••••'):s;if(v('hideRemaster','false')==='true')t=t.replace(/\s*[-–(]?\s*\d{4}\s+Remaster[^)]*\)?/ig,'').replace(/\s*\(Remaster(ed)?[^)]*\)/ig,'').trim();document.getElementById('artist').textContent=censor(a);document.getElementById('song').textContent=censor(t)||'No track data';document.getElementById('cover').src=v('art','');document.getElementById('widget').style.setProperty('--text',v('textColor','#30343b'));document.getElementById('widget').style.setProperty('--wave',v('waveColor','#fff'));if(v('cover','true')==='false')document.getElementById('cover-wrap').style.display='none';if(v('wave','true')==='false')document.getElementById('wave').style.display='none';const c=document.getElementById('cover-map'),im=document.getElementById('cover');if(v('gradient','true')==='true'&&v('art','')){im.crossOrigin='anonymous';im.onload=()=>{try{const n=160,w=document.createElement('canvas');w.width=n;w.height=n;const x=w.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,n,n);const f=x.getImageData(0,0,n,n),d=f.data,hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],lo=hex(v('shadow','#172b46')),mi=hex(v('mid','#8167a8')),hi=hex(v('highlight','#ffd6a0')),mix=Number(v('strength','100'))/100;for(let i=0;i<d.length;i+=4){const l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255,left=l<.5?lo:mi,right=l<.5?mi:hi,u=l<.5?l*2:(l-.5)*2;for(let k=0;k<3;k++)d[i+k]+=(left[k]+(right[k]-left[k])*u-d[i+k])*mix}c.width=n;c.height=n;c.getContext('2d').putImageData(f,0,0)}catch{c.style.display='none'}};im.onerror=()=>c.style.display='none'};
</script></body></html>
