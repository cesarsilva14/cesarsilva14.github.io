<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing Widget</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:transparent;color:var(--text-color,#30343b)}body{padding:10px}.widget{display:flex;align-items:center;gap:14px;width:max-content;max-width:100%;min-height:90px;padding:4px;background:transparent}.cover{position:relative;width:80px;height:80px;flex:0 0 auto;overflow:hidden;border-radius:var(--radius,8px)}.cover img{display:block;width:100%;height:100%;object-fit:cover}.map{position:absolute;inset:0;background:linear-gradient(135deg,var(--shadow),var(--mid) 50%,var(--highlight));opacity:var(--strength,.62);mix-blend-mode:color}.details{min-width:0;max-width:460px}.artist,.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:0 0 3px;font-size:16px;font-weight:600}.song{margin:0;font-size:14px;font-weight:500}.wave{display:block;width:min(280px,100%);height:16px;margin-top:5px}.wave path{fill:none;stroke:var(--wave);stroke-width:2.5;stroke-linecap:round}
  </style>
</head>
<body>
  <div class="widget">
    <div class="cover" id="cover"><img id="art" alt="Album cover" /><div class="map" id="map"></div></div>
    <div class="details"><p class="artist" id="artist"></p><p class="song" id="song"></p><svg class="wave" id="wave" viewBox="0 0 280 18" preserveAspectRatio="none"><path d="M0 9 C10 9 10 2 20 2 S30 16 40 16 50 5 60 5 70 13 80 13 90 2 100 2 110 16 120 16 130 5 140 5 150 13 160 13 170 2 180 2 190 16 200 16 210 5 220 5 230 13 240 13 250 2 260 2 270 16 280 9" /></svg></div>
  </div>
  <script>
    const q=new URLSearchParams(location.search);
    const get=(k,d)=>q.get(k)||d;
    const root=document.documentElement;
    const vals={shadow:get('shadow','#172b46'),mid:get('midtone','#8167a8'),highlight:get('highlight','#ffd6a0'),strength:Number(get('strength','62'))/100,radius:Number(get('radius','12')),text:get('textColor','#30343b'),wave:get('waveColor','#8c62c7')};
    root.style.setProperty('--shadow',vals.shadow);root.style.setProperty('--mid',vals.mid);root.style.setProperty('--highlight',vals.highlight);root.style.setProperty('--strength',vals.strength);root.style.setProperty('--radius',`${vals.radius}px`);root.style.setProperty('--text-color',vals.text);root.style.setProperty('--wave',vals.wave);
    document.getElementById('artist').textContent=get('artist','M83');document.getElementById('song').textContent=get('title','Midnight City');document.getElementById('art').src=get('art','https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80');
    if(get('showGradient','true')==='false')document.getElementById('map').style.display='none';if(get('showWave','true')==='false')document.getElementById('wave').style.display='none';
  </script>
</body>
</html>
