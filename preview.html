<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novatorem Now Playing Widget</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,Arial,sans-serif;background:transparent;color:#444}body{padding:4px}.widget{display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px;padding:3px;background:transparent}.cover-link{position:relative;width:80px;height:80px;flex:0 0 auto;overflow:hidden;border:3px solid var(--bar,#53b14f);border-radius:4px}.cover-link img{display:block;width:100%;height:100%;object-fit:cover}.cover-map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.details{width:min(330px,calc(100vw - 110px));min-width:0;text-align:center}.artist,.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:0 0 3px;color:#444;font-size:17px;font-weight:600}.song{margin:0;color:#999;font-size:15px}.wave{display:block;width:100%;height:15px;margin-top:4px}.wave path{fill:none;stroke:var(--bar,#53b14f);stroke-width:2.4;stroke-linecap:round}
</style></head>
<body><div class="widget" id="widget"><a id="cover-link" class="cover-link" href="#" target="_blank" rel="noreferrer"><img id="cover" alt="Album cover"><canvas id="cover-map" class="cover-map"></canvas></a><div class="details"><p id="artist" class="artist"></p><p id="song" class="song">Connect Spotify to load your track</p><svg class="wave" id="wave" viewBox="0 0 360 24" preserveAspectRatio="none"><path d="M0 12 C12 12 12 3 24 3 S36 21 48 21 60 7 72 7 84 17 96 17 108 3 120 3 132 21 144 21 156 8 168 8 180 16 192 16 204 4 216 4 228 20 240 20 252 7 264 7 276 17 288 17 300 3 312 3 324 21 336 21 348 12 360 12"/></svg></div></div>
<script>
const q=new URLSearchParams(location.search),v=(k,d)=>q.get(k)??d;let artist=v('artist',''),title=v('title','');if(v('interchange','false')==='true')[artist,title]=[title,artist];if(v('censor','false')==='true'){artist=artist.replace(/\b(fuck|fucking|shit|bitch|damn|asshole)\b/ig,'••••');title=title.replace(/\b(fuck|fucking|shit|bitch|damn|asshole)\b/ig,'••••');}if(v('hide_remaster','false')==='true')title=title.replace(/\s*[-–(]?\s*\d{4}\s+Remaster[^)]*\)?/ig,'').replace(/\s*\(Remaster(ed)?[^)]*\)/ig,'').trim();document.getElementById('artist').textContent=artist;document.getElementById('song').textContent=title||'Connect Spotify to load your track';document.getElementById('cover').src=v('art','');document.getElementById('cover-link').href=v('open_spotify','false')==='true'?v('track_url','#'):'#';document.body.style.background=v('background','transparent');document.querySelector('.widget').style.setProperty('--bar',v('bar','#53b14f'));if(v('cover','true')==='false')document.getElementById('cover-link').style.display='none';if(v('wave','true')==='false')document.getElementById('wave').style.display='none';const canvas=document.getElementById('cover-map'),img=document.getElementById('cover');if(v('gradient','true')==='true'&&v('art','')){img.crossOrigin='anonymous';img.onload=()=>{try{const n=180,c=document.createElement('canvas');c.width=n;c.height=n;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,n,n);const pixels=x.getImageData(0,0,n,n),d=pixels.data,hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],a=hex(v('shadow','#172b46')),b=hex(v('mid','#8167a8')),z=hex(v('highlight','#ffd6a0')),strength=Number(v('strength','100'))/100;for(let i=0;i<d.length;i+=4){const L=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255,lo=L<.5?a:b,hi=L<.5?b:z,t=L<.5?L*2:(L-.5)*2;for(let k=0;k<3;k++)d[i+k]=d[i+k]+(lo[k]+(hi[k]-lo[k])*t-d[i+k])*strength;}canvas.width=n;canvas.height=n;canvas.getContext('2d').putImageData(pixels,0,0);}catch{canvas.style.display='none';}};img.onerror=()=>canvas.style.display='none';if(img.src!==location.href){} }
</script></body></html>
